name: Release Vectracast
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      VECTRACAST_APP_REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Validate release tag and notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test "$(uname -m)" = arm64
          node -e 'const p=require("./package.json");if(process.env.RELEASE_TAG!==`v${p.version}`)throw Error("Tag and version differ")'
          test -s RELEASE_NOTES.md
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Test the signed bundle
        run: node --test --test-concurrency=1 tests/platform/*.test.mjs
      - run: node scripts/package-app-release.mjs
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft > release-state.txt; then
            if [ "$(cat release-state.txt)" = false ]; then
              echo "Release is already published; leaving its assets unchanged."
              exit 0
            fi
            gh release upload "$RELEASE_TAG" build/release/Vectracast-*.zip build/release/SHA256SUMS build/release/appcast.xml --clobber
          else
            gh release create "$RELEASE_TAG" build/release/Vectracast-*.zip build/release/SHA256SUMS build/release/appcast.xml --verify-tag --draft --title "Vectracast $RELEASE_TAG" --notes-file RELEASE_NOTES.md
          fi
          gh release edit "$RELEASE_TAG" --draft=false --latest
